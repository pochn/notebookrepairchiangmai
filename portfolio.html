<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลงานซ่อมโน๊ตบุ๊คทั้งหมด - ร้านซ่อมโน๊ตบุ๊ค เชียงใหม่</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS (ใช้ไฟล์เดียวกับหน้า index เพื่อคงธีม) -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/portfolio.css">
    <link rel="stylesheet" href="css/article.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <!-- Navbar จะถูกโหลดเข้ามาโดย js/main.js -->
    <div id="navbar-placeholder"></div>

   <!-- Hero / Header -->
    <section class="pb-4 bg-light border-bottom" style="padding-top: 150px !important;">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb bg-transparent p-0 mb-2">
                    <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">หน้าแรก</a></li>
                    <li class="breadcrumb-item active" aria-current="page">ผลงานซ่อมทั้งหมด</li>
                </ol>
            </nav>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 fw-bold mb-1 text-dark">ผลงานซ่อมโน๊ตบุ๊คทั้งหมด</h1>
                    <p class="text-muted mb-0">เรียงตามล่าสุด — ดูรายละเอียด เพื่อดูขั้นตอนการซ่อมจริง</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Controls: Search & Filter -->
    <section class="py-4">
        <div class="container">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input id="portfolio-search" type="search" class="form-control" placeholder="ค้นหา ผลงานซ่อม (รุ่น, อาการ, แบรนด์)">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="portfolio-brand" class="form-select">
                        <option value="">ทั้งหมดตามแบรนด์</option>
                    </select>
                </div>
                <div class="col-md-3 text-md-end">
                    <a href="index.html" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left me-2"></i>กลับหน้าหลัก</a>
                </div>
            </div>
        </div>
    </section>

    <!-- All Portfolio Container -->
    <section class="pb-5">
        <div class="container">
            <div id="all-portfolio-container" class="row g-4"></div>
        </div>
    </section>

    <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main JS (โหลด navbar/footer และ helpers) -->
    <script src="js/main.js"></script>
    <!-- Portfolio page JS -->
    <script src="js/portfolio.js"></script>
    <script src="js/navbar.js"></script>
</body>
</html>
